# Render Blueprint for RedRob Ranker
# This file configures automatic deployment on Render.com

services:
  # Backend API Service
  - type: web
    name: redrob-ranker-api
    runtime: docker
    plan: free
    autoDeploy: true
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health
    healthCheckTimeout: 100

  # Frontend Static Site
  - type: static
    name: redrob-ranker-frontend
    buildCommand: cd frontend && npm install && npm run build
    publish: frontend/dist
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://redrob-ranker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
